server:
  listen: ":8080"
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  status_endpoint_enabled: false  # Expose GET /status endpoint (default: false for security)
  unauthorized_redirect:
    enabled: false  # Redirect unauthorized requests instead of returning 401/404 (default: false)
    url: ""         # Redirect target URL. Supports three formats:
                    # 1. "/path" - same-site path
                    # 2. "www.example.com" - domain (auto-prefixed with http/https based on current request)
                    # 3. "https://example.com" - full URL (used as-is, ignoring current request scheme)

tunnel:
  poll_timeout: "30s"
  session_timeout: "60s"   # must be >= 2x poll_timeout, or the broker panics at startup
  # coalesce_window: "2ms"  # how long a long-poll response waits for more data
                            # to accumulate once any is available, instead of
                            # flushing immediately. Default 2ms if omitted.
  # poll_buffer_size: 262144  # bytes per long-poll response. Default 256KiB if omitted.
  # max_send_bytes: 1048576   # cap on a single request body. Default 1MiB if omitted.
  # high_water_warn: 0        # log once when a session buffers this many bytes. 0 disables.
  # poll_mode: "stream"      # "stream" (default) or "batch". Stream mode removes the
                            # batch mode ceiling of one poll_buffer_size per RTT on
                            # downstream throughput.
  # enable_websocket: false  # Offer pollmux's WebSocket transport (GET /tunnel/{id}/ws)
                            # to clients that ask for it (transport.prefer_websocket on
                            # the consumer/provider side). Off by default: needs any
                            # reverse proxy/CDN in front of the broker to forward
                            # WebSocket upgrade requests. Worth turning on if stream
                            # mode's upload direction hangs behind your CDN (observed
                            # with Cloudflare's standard tiers buffering long-lived
                            # chunked request bodies) — WebSocket rides one persistent
                            # connection instead, which such CDNs typically forward
                            # live. Safe to enable even against older clients: they
                            # just never ask for it and negotiation falls back to
                            # poll_mode.
  # enable_resume: false     # Let clients that ask for it (transport.prefer_resume on
                            # the consumer/provider side) negotiate a resumable
                            # session: when its transport breaks, the broker keeps
                            # the session for up to resume_grace and accepts a
                            # POST /tunnel/{id}/resume that re-attaches it, so the
                            # yamux session and every SSH/SOCKS stream inside it
                            # survive. This is the fix for long streams dying at the
                            # ~1h "max connection age" some CDNs/reverse proxies
                            # (observed with Cloudflare) enforce regardless of
                            # traffic. Only WebSocket or stream mode in both
                            # directions can be resumed. Safe against older clients:
                            # they never ask, nothing changes for them. Both hops
                            # (consumer and provider) must opt in for a stream to
                            # survive either side's transport breaking.
  # resume_grace: "30s"      # How long a resumable session waits for /resume after its
                            # transport drops before being retired. Default 30s;
                            # capped at 5m (the broker panics at startup above that),
                            # since a detached session holds its replay buffer for
                            # the whole grace.

auth:
  enabled: false
  token: ""  # Set a shared secret token when auth is enabled (e.g., "my-secret-token-123")

logging:
  level: "info"
