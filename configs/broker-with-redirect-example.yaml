# Example Broker configuration with unauthorized redirect enabled
# This demonstrates how to redirect unauthorized requests to another URL

server:
  listen: ":8080"
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
  status_endpoint_enabled: false
  unauthorized_redirect:
    enabled: true           # Enable redirect for unauthorized requests
    url: "www.google.com"   # Redirect to Google (will use http:// or https:// based on current request)
    # Other examples:
    # url: "/login"                    # Same-site redirect to /login page
    # url: "https://example.com"       # Force HTTPS redirect to example.com

tunnel:
  poll_timeout: "30s"
  session_timeout: "60s"   # must be >= 2x poll_timeout, or the broker panics at startup
  # coalesce_window: "2ms"  # how long a long-poll response waits for more data
                            # to accumulate once any is available, instead of
                            # flushing immediately. Default 2ms if omitted.
  # poll_buffer_size: 262144  # bytes per long-poll response. Default 256KiB if omitted.
  # max_send_bytes: 1048576   # cap on a single request body. Default 1MiB if omitted.
  # high_water_warn: 0        # log once when a session buffers this many bytes. 0 disables.
  # poll_mode: "stream"      # "stream" (default) or "batch". Stream mode removes the
                            # batch mode ceiling of one poll_buffer_size per RTT on
                            # downstream throughput.

auth:
  enabled: true
  token: "my-secret-token-123"  # Only requests with valid token can access tunnel endpoints

logging:
  level: "info"

# BEHAVIOR:
# - Requests to /tunnel/* without valid auth token -> 302 redirect to www.google.com
# - Requests to non-existent paths (e.g. /, /admin, etc) -> 302 redirect to www.google.com
# - No error messages are returned, only 302 redirect
