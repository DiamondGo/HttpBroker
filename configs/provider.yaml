broker:
  url: "http://127.0.0.1:8080"
  endpoint: "default"
  insecure_skip_verify: false  # Skip TLS cert verification for self-signed certs (use only for testing)
  auth_token: ""               # Authentication token (must match broker's token if auth is enabled)

provider:
  scrub_headers: true
  dial_timeout: "10s"

transport:
  poll_interval: "50ms"
  retry_backoff: "5s"
  # coalesce_window: "2ms"  # how long Write() waits before the first send of
                            # an idle-to-active burst, letting immediately-
                            # following writes merge into one HTTP request.
                            # Default 2ms if omitted.
  # poll_mode: "stream"     # "stream" (default) or "batch". Stream mode asks the
                            # broker to negotiate stream mode; falls back to batch
                            # silently if the broker doesn't support it.
  # poll_grace: "10s"       # Extra time a poll request's response-header wait gets
                            # beyond what pollmux itself needs. In stream mode this
                            # is effectively the whole timeout, since the broker
                            # flushes headers almost immediately once it replies at
                            # all — raise this if the broker sits behind a reverse
                            # proxy/CDN/load balancer whose own latency can exceed
                            # the default 10s. Default 10s if omitted.
  # upload_stream_preference: ""  # "" (default) auto-detects upload streaming with
                            # a one-time connect-time probe; "stream" forces it
                            # without probing (only safe once you've separately
                            # confirmed every hop forwards a long-lived chunked
                            # request body live — some proxies, e.g. Cloudflare's
                            # standard tiers, buffer it instead and hang the tunnel
                            # outright); "batch" always uses the discrete per-chunk
                            # send path.
  # upload_probe_timeout: "15s"  # Bounds the auto-detect probe above. Default 15s.

logging:
  level: "info"
