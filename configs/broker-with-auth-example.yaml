# Example Broker configuration with authentication enabled
# This is a demonstration of how to enable Bearer Token authentication

server:
  listen: ":8080"
  tls:
    enabled: false         # IMPORTANT: Set to true in production when using auth
    cert_file: ""          # Path to TLS certificate
    key_file: ""           # Path to TLS private key
  status_endpoint_enabled: false  # Expose GET /status endpoint (default: false for security)
  unauthorized_redirect:
    enabled: false  # Redirect unauthorized requests instead of returning 401/404
    url: ""         # Example: "/login", "www.example.com", or "https://example.com"

tunnel:
  poll_timeout: "30s"
  session_timeout: "60s"   # must be >= 2x poll_timeout, or the broker panics at startup
  # coalesce_window: "2ms"  # how long a long-poll response waits for more data
                            # to accumulate once any is available, instead of
                            # flushing immediately. Default 2ms if omitted.
  # poll_buffer_size: 262144  # bytes per long-poll response. Default 256KiB if omitted.
  # max_send_bytes: 1048576   # cap on a single request body. Default 1MiB if omitted.
  # high_water_warn: 0        # log once when a session buffers this many bytes. 0 disables.
  # poll_mode: "stream"      # "stream" (default) or "batch". Stream mode removes the
                            # batch mode ceiling of one poll_buffer_size per RTT on
                            # downstream throughput.

auth:
  enabled: true
  token: "my-secret-token-123"  # Change this to a strong random token

logging:
  level: "info"

# SECURITY NOTICE:
# When auth.enabled is true, you MUST also enable TLS (tls.enabled: true) to
# encrypt the token in transit. Using authentication over plain HTTP exposes
# your token to network observers.
#
# Generate a strong token with:
#   openssl rand -base64 32
#
# Or in Python:
#   python3 -c "import secrets; print(secrets.token_urlsafe(32))"

